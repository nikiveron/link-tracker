global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'scrapper'
    static_configs:
      - targets: ['scrapper:8080']
    metrics_path: '/metrics'

  - job_name: 'bot'
    static_configs:
      - targets: ['bot:80']
    metrics_path: '/metrics'

  - job_name: 'ai-agent'
    static_configs:
      - targets: ['ai-agent:80']
    metrics_path: '/metrics'
